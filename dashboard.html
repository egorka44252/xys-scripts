<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FL Zone — Главная</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>FL Zone</h1>
        <span>для битмейкеров</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Каталог</div>
          <div class="nav-item active" data-section="plugins">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
            <span>Плагины</span>
          </div>
          <div class="nav-item" data-section="drumkits">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
            <span>Драм-киты</span>
          </div>
          <div class="nav-item" data-section="samples">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414 1.414m2.828-9.9a9 9 0 0112.728 0"/></svg>
            <span>Сэмплы</span>
          </div>
          <div class="nav-item" data-section="midi">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
            <span>MIDI</span>
          </div>
          <div class="nav-item" data-section="banks">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>Банки</span>
          </div>
          <div class="nav-item" data-section="presets">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
            <span>Пресеты</span>
          </div>
          <div class="nav-item" data-section="projects">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
            <span>Проекты</span>
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Сообщество</div>
          <div class="nav-item" data-section="beats">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
            <span>Биты пользователей</span>
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="search-box">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Поиск плагинов, китов, сэмплов..." id="searchInput">
        </div>
        <div class="topbar-right">
          <a href="profile.html" class="account-btn" id="accountBtn">
            <div class="account-avatar" id="avatarLetter">U</div>
            <span class="account-name" id="userName">User</span>
          </a>
        </div>
      </header>

      <div class="content">
        <div class="content-header">
          <h2 id="sectionTitle">Плагины</h2>
          <p id="sectionDesc">Лучшие VST/AU плагины для твоих битов</p>
        </div>

        <div class="cards-grid" id="cardsGrid">
          <!-- Cards will be rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Auth check
    const user = JSON.parse(localStorage.getItem('flzone_user') || 'null');
    if (!user) {
      window.location.href = 'index.html';
    }

    // Set user info
    document.getElementById('userName').textContent = user.nickname;
    document.getElementById('avatarLetter').textContent = user.nickname.charAt(0).toUpperCase();

    // Demo content
    const content = {
      plugins: {
        title: 'Плагины',
        desc: 'Лучшие VST/AU плагины для твоих битов',
        items: [
          { name: 'Serum 2.0', author: 'Xfer Records', price: 'free', icon: '🎹' },
          { name: 'Omnisphere 2', author: 'Spectrasonics', price: 'paid', icon: '🌌' },
          { name: 'FabFilter Pro-Q 3', author: 'FabFilter', price: 'paid', icon: '🎚️' },
          { name: 'Vital', author: 'Matt Tytel', price: 'free', icon: '✨' },
          { name: 'RC-20 Retro Color', author: 'XLN Audio', price: 'paid', icon: '📼' },
          { name: 'ShaperBox 3', author: 'Cableguys', price: 'paid', icon: '📦' },
        ]
      },
      drumkits: {
        title: 'Драм-киты',
        desc: 'Готовые драм-киты прямо в твою DAW',
        items: [
          { name: 'Trap Empire Kit', author: 'FL Zone', price: 'free', icon: '🥁' },
          { name: 'Drill From UK', author: 'Street Beats', price: 'paid', icon: '🔥' },
          { name: '808 Galaxy', author: 'Bass Lord', price: 'free', icon: '💥' },
          { name: 'Cinematic Hits', author: 'Epic Sound', price: 'paid', icon: '🎬' },
        ]
      },
      samples: {
        title: 'Сэмплы',
        desc: 'Royalty-free сэмплы и лупы',
        items: [
          { name: 'Melody Pack Vol.1', author: 'Melody King', price: 'free', icon: '🎵' },
          { name: 'Vocal Chops Dark', author: 'Voice Lab', price: 'paid', icon: '🎤' },
          { name: 'Atmospheres Pack', author: 'Soundscape', price: 'free', icon: '🌫️' },
        ]
      },
      midi: {
        title: 'MIDI',
        desc: 'MIDI-паттерны и мелодии',
        items: [
          { name: 'Trap Melodies 50', author: 'MIDI Factory', price: 'free', icon: '🎼' },
          { name: 'Jazz Progressions', author: 'Jazz Cat', price: 'paid', icon: '🎷' },
        ]
      },
      banks: {
        title: 'Банки',
        desc: 'Sound banks для синтезаторов',
        items: [
          { name: 'Serum Presets Dark', author: 'Preset Lab', price: 'paid', icon: '💾' },
          { name: 'Massive X Bundle', author: 'NI Community', price: 'free', icon: '🎛️' },
        ]
      },
      presets: {
        title: 'Пресеты',
        desc: 'Готовые пресеты для сведения и вокала',
        items: [
          { name: 'Vocal Chain Pro', author: 'Mix Master', price: 'paid', icon: '🎙️' },
          { name: 'Mastering Preset', author: 'Loudness', price: 'free', icon: '🔊' },
        ]
      },
      projects: {
        title: 'Проекты',
        desc: 'Готовые проекты FL Studio / Ableton',
        items: [
          { name: 'Trap Template 2025', author: 'Beat School', price: 'free', icon: '📁' },
          { name: 'Drill Project Full', author: 'UK Producer', price: 'paid', icon: '📂' },
        ]
      },
      beats: {
        title: 'Биты пользователей',
        desc: 'Биты, загруженные сообществом',
        items: [] // will be filled from localStorage
      }
    };

    // Load community beats from all users
    function loadCommunityBeats() {
      const users = JSON.parse(localStorage.getItem('flzone_users') || '[]');
      const beats = [];
      users.forEach(u => {
        (u.uploads || []).forEach(up => {
          if (up.type === 'beat' || up.type === 'drumkit' || up.type === 'sample') {
            beats.push({
              name: up.name,
              author: u.nickname,
              price: up.price === 'free' ? 'free' : 'paid',
              icon: up.type === 'beat' ? '🎧' : up.type === 'drumkit' ? '🥁' : '🎵'
            });
          }
        });
      });
      content.beats.items = beats.length ? beats : [
        { name: 'Пока нет загрузок', author: 'Загрузи первый!', price: 'free', icon: '📭' }
      ];
    }

    function renderSection(key) {
      const section = content[key];
      if (!section) return;

      if (key === 'beats') loadCommunityBeats();

      document.getElementById('sectionTitle').textContent = section.title;
      document.getElementById('sectionDesc').textContent = section.desc;

      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = section.items.map(item => `
        <div class="card">
          <div class="card-preview">${item.icon}</div>
          <div class="card-body">
            <div class="card-title">${item.name}</div>
            <div class="card-meta">
              <span>${item.author}</span>
              <span class="badge ${item.price === 'free' ? 'badge-free' : 'badge-paid'}">
                ${item.price === 'free' ? 'Бесплатно' : 'Платно'}
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Nav click
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        renderSection(item.dataset.section);
      });
    });

    // Initial render
    renderSection('plugins');
  </script>
</body>
</html>
